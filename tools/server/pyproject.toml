[project]
name = "mcscram-server"
version = "0.1.0"
description = "Small service wrapper around the native mcSCRAM Python extension."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
mcscram-server = "mcscram_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

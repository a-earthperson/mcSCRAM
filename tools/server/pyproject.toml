[project]
name = "fuzzybits-server"
version = "0.18.1"
description = "FastAPI server: compile OpenPSA/MEF fault trees to .pcfb and sample the top event."
readme = "README.md"
requires-python = ">=3.12,<3.16"
license = {text = "AGPL-3.0-or-later"}
authors = [{ name = "fuzzybit-org" }]
dependencies = [
    "fuzzybits==0.18.1",
    "fastapi>=0.115",
    "numpy>=2.4.6",
    "platformdirs>=4.0",
    "scipy>=1.17.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
fuzzybits-server = "fuzzybits_server.app:main"

[project.urls]
Homepage = "https://github.com/fuzzybit-org/fuzzybits"
Issues = "https://github.com/fuzzybit-org/fuzzybits/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# fuzzybits is not on PyPI yet (#36). Pin it in [project] so the published
# wheel has Requires-Dist: fuzzybits==0.17.1, but resolve it from this
# checkout's static pyproject metadata so `uv lock` / `uv sync` never compile
# the native extension. Install is skipped in CI and Docker
# (`uv sync --no-install-package fuzzybits`); the runtime image / a locally
# built wheel supplies the engine.
[tool.uv.sources]
fuzzybits = { path = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/fuzzybits_server"]

# CSR UI (`webui/dist`) is gitignored. hatch_build.py force-includes it into
# the wheel (`fuzzybits_server/webui`) and sdist (`webui/dist`) so a wheel
# built from the sdist does not need Node. Editable installs (`uv sync`) skip
# the hook so pytest/Docker stay solvable without a prior npm build.

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/hatch_build.py",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "native: requires the fuzzybits wheel",
]

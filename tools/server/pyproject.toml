[project]
name = "mcscram-server"
version = "0.1.0"
description = "Small service wrapper around the native mcSCRAM Python extension."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mcscram-server = "mcscram_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

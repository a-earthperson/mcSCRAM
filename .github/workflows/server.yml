# FastAPI server tests (tools/server). Public repo: GitHub-hosted runners only.
#
# pytest: pure Python (BernoulliSampler / numpy / scipy / cache helpers) and
# does not import mcscram_native. Native-dependent tests are marked
# @pytest.mark.native and skipped when the wheel is absent.
#
# native: same suite with -m native inside the published runtime image so
# import mcscram_native works. Skipped for fork PRs (private GHCR). Pin
# FUZZYBITS_RUNTIME_IMAGE; after #70 merge this can move to nightly-generic.
name: Server

on:
  pull_request:
  push:
    branches: [develop, "ci/**"]

concurrency:
  group: server-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Newest published generic runtime with the Python pcfb API (#71).
  # After #70 merge, switch to ghcr.io/fuzzybit-org/fuzzybits-runtime:nightly-generic.
  FUZZYBITS_RUNTIME_IMAGE: ghcr.io/fuzzybit-org/fuzzybits-runtime:ci-a812f144f1d9-generic

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/server/uv.lock

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Test
        working-directory: tools/server
        run: |
          uv sync --frozen --extra dev
          uv run pytest -m "not native" --tb=short -q

  native:
    name: pytest-native
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Native tests
        env:
          RUNTIME_IMAGE: ${{ env.FUZZYBITS_RUNTIME_IMAGE }}
        run: |
          set -euo pipefail
          docker pull "${RUNTIME_IMAGE}"
          docker pull ghcr.io/astral-sh/uv:0.9.7@sha256:ba4857bf2a068e9bc0e64eed8563b065908a4cd6bfb66b531a9c424c8e25e142
          docker create --name uvbin ghcr.io/astral-sh/uv:0.9.7@sha256:ba4857bf2a068e9bc0e64eed8563b065908a4cd6bfb66b531a9c424c8e25e142
          docker cp uvbin:/uv "${RUNNER_TEMP}/uv"
          docker rm uvbin
          chmod +x "${RUNNER_TEMP}/uv"
          # docker run (not a GHA container job): LLVM JIT SIGILL'd under the
          # Actions container runtime on some hosted SKUs; E2E uses this path.
          docker run --rm -i \
            --user root \
            -e ACPP_VISIBILITY_MASK=omp \
            -e ACPP_DEBUG_LEVEL=0 \
            -e ACPP_APPDB_DIR=/tmp/acpp-appdb \
            -e UV_LINK_MODE=copy \
            -e OMP_NUM_THREADS=2 \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -v "${RUNNER_TEMP}/uv:/usr/local/bin/uv:ro" \
            -w /tmp \
            --entrypoint bash \
            "${RUNTIME_IMAGE}" \
            -s <<'EOS'
          set -euo pipefail
          mkdir -p /tmp/acpp-appdb
          cp -a /src /work
          cd /work/tools/server
          python3 -c "import fuzzybits, mcscram_native; print(fuzzybits.__file__)"
          uv venv --system-site-packages
          uv sync --frozen --extra dev
          venv_site="$(.venv/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          sys_site="$(python3 -c 'import fuzzybits, pathlib; p=pathlib.Path(fuzzybits.__file__).resolve(); print(p.parent if p.name != "__init__.py" else p.parent.parent)')"
          printf '%s\n' "${sys_site}" > "${venv_site}/zz-system-fuzzybits.pth"
          .venv/bin/python -c "import mcscram_native, fuzzybits"
          timeout 120 uv run pytest -m native --tb=short -q
          EOS

# FastAPI server tests (tools/server). Public repo: GitHub-hosted runners only.
#
# The imported pytest suite is pure Python (BernoulliSampler / numpy / scipy)
# and does not import mcscram_native. Building the ~183 MB generic fuzzybits
# wheel here (AdaptiveCpp + LLVM via docker/wheel.Dockerfile) is not justified
# for zero native tests, and the toolchain image is a private GHCR package
# that fork PRs cannot pull. Native-dependent tests are marked
# @pytest.mark.native and skipped when the wheel is absent. A native job is
# deferred until those tests exist (and can consume a published wheel).
name: Server

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: server-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/server/uv.lock

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Test
        working-directory: tools/server
        run: |
          uv sync --frozen --extra dev
          uv run pytest -m "not native" --tb=short -q

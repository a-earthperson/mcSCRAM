      - name: Log in to GHCR (packages:read only)
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: generic (SSCP) product + ctest -L mc + smoke
        run: scripts/ci/gpu-test.sh generic
      - name: Drop this job's container
        if: always()
        run: docker rm -f "${FUZZYBITS_CTR}" || true
      - name: Trim workspace (keep .ccache for cache post)
        if: always()
        run: |
          scripts/ci/docker-toolchain-run.sh --name "${FUZZYBITS_CTR}" -- scripts/ci/inner-build.sh generic trim || true
          rm -rf build dist .cache || true

  sm75:
    name: sm75-generic
    runs-on: [self-hosted, Linux, X64, nvidia, sm_75, gtx_1660s]
    timeout-minutes: 45
    continue-on-error: true
    concurrency:
      group: gpu-xerxes-1660s
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_GPUS: device=0
      FUZZYBITS_CTR: fuzzybits-ci-${{ github.run_id }}-sm75-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: GPU mapping probe (optional; may have no device)
        run: |
          echo "runner=${RUNNER_NAME:-} docker_gpus=${DOCKER_GPUS}"
          echo "CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES-UNSET}"

# Self-hosted GPU tests. Never on pull_request / pull_request_target /
# workflow_run. Pre-merge coverage is a same-repo push to ci/** (only
# collaborators can push branches here).
#
# Binaries are built on the runner inside the toolchain container rather than
# downloaded as hosted artifacts: generic SSCP needs the AdaptiveCpp JIT
# (libLLVM, llvm-to-backend, libdevice.10.bc) at runtime, which is already in
# the image. xerxes has 48 cores so the compile is faster than hosted 4-core.
# The image pull uses GITHUB_TOKEN with packages: read only — no other secrets.
name: GPU tests

on:
  push:
    branches: [develop, main, "ci/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  gpu:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # xerxes Docker maps physical GPU 0 = Tesla V100S (shared by all
          # sm_70 runners). Concurrency group serialises them.
          - name: sm70-generic
            runs_on: [self-hosted, Linux, X64, nvidia, sm_70, v100s]
            concurrency_group: gpu-xerxes-v100s
            preset: generic
            docker_gpus: device=0
            optional: false
          - name: sm70-cuda-sm70
            runs_on: [self-hosted, Linux, X64, nvidia, sm_70, v100s]
            concurrency_group: gpu-xerxes-v100s
            preset: cuda-sm70
            docker_gpus: device=0
            optional: false
          # physical GPU 1 = RTX 3070
          - name: sm86-generic
            runs_on: [self-hosted, Linux, X64, nvidia, sm_86, rtx_3070]
            concurrency_group: gpu-xerxes-3070
            preset: generic
            docker_gpus: device=1
            optional: false
          - name: sm120-generic
            runs_on: [self-hosted, Linux, X64, nvidia, fast, sm_120, rtx_5060ti_8gb]
            concurrency_group: gpu-shelly-5060ti
            preset: generic
            docker_gpus: device=0
            optional: false
          # sm_75 may have no GPU (xerxes exposes only two devices to Docker).
          - name: sm75-generic
            runs_on: [self-hosted, Linux, X64, nvidia, sm_75, gtx_1660s]
            concurrency_group: gpu-xerxes-1660s
            preset: generic
            docker_gpus: device=0
            optional: true
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.optional }}
    concurrency:
      group: ${{ matrix.concurrency_group }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      PRESET: ${{ matrix.preset }}
      BUILD_TESTING: "ON"
      DOCKER_GPUS: ${{ matrix.docker_gpus }}
      FUZZYBITS_CTR: fuzzybits-ci-${{ github.run_id }}-${{ matrix.name }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Load toolchain pins
        run: |
          set -eu
          set -a
          # shellcheck disable=SC1091
          . ./toolchain.env
          set +a
          sha="$(sha256sum toolchain.env | cut -c1-12)"
          {
            echo "ACPP_REF=${ACPP_REF}"
            echo "CLANG_VERSION=${CLANG_VERSION}"
            echo "TOOLCHAIN_SHA=${sha}"
            echo "TOOLCHAIN_IMAGE=ghcr.io/fuzzybit-org/fuzzybits-toolchain:${ACPP_REF}-generic-${sha}"
          } >> "${GITHUB_ENV}"

      - name: ccache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .ccache
          key: ccache-linux-${{ env.PRESET }}-${{ env.TOOLCHAIN_SHA }}-clang${{ env.CLANG_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ env.PRESET }}-${{ env.TOOLCHAIN_SHA }}-clang${{ env.CLANG_VERSION }}-
            ccache-linux-${{ env.PRESET }}-${{ env.TOOLCHAIN_SHA }}-

      - name: GPU mapping probe
        run: |
          echo "runner=${RUNNER_NAME:-} docker_gpus=${DOCKER_GPUS}"
          echo "CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES-UNSET}"
          echo "NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES-UNSET}"
          nvidia-smi -L || true
          docker run --rm --gpus "${DOCKER_GPUS}" --entrypoint bash \
            nvidia/cuda:12.8.1-base-ubuntu24.04 -lc 'nvidia-smi -L'

      - name: Log in to GHCR (packages:read only)
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build product
        run: scripts/ci/docker-toolchain-run.sh --gpus "${DOCKER_GPUS}" --name "${FUZZYBITS_CTR}" -- scripts/ci/inner-build.sh "${PRESET}" configure-product

      - name: Build tests
        run: scripts/ci/docker-toolchain-run.sh --gpus "${DOCKER_GPUS}" --name "${FUZZYBITS_CTR}" -- scripts/ci/inner-build.sh "${PRESET}" tests

      - name: ctest -L mc (CUDA)
        timeout-minutes: 20
        run: scripts/ci/docker-toolchain-run.sh --gpus "${DOCKER_GPUS}" --name "${FUZZYBITS_CTR}" -- scripts/ci/inner-build.sh "${PRESET}" ctest-mc

      - name: smoke.sh (chinese, baobab1, das9201)
        timeout-minutes: 10
        run: scripts/ci/docker-toolchain-run.sh --gpus "${DOCKER_GPUS}" --name "${FUZZYBITS_CTR}" -- scripts/ci/inner-build.sh "${PRESET}" smoke

      - name: ccache stats
        if: always()
        run: scripts/ci/docker-toolchain-run.sh --gpus "${DOCKER_GPUS}" --name "${FUZZYBITS_CTR}" -- scripts/ci/inner-build.sh "${PRESET}" ccache-stats

      - name: Drop this job's container
        if: always()
        run: docker rm -f "${FUZZYBITS_CTR}" || true

      - name: Trim workspace (keep .ccache for cache post)
        if: always()
        run: rm -rf build dist .cache

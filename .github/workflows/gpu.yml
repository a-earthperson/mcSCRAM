      - name: Trim workspace (keep .ccache for cache post)
        if: always()
        run: bash scripts/ci/reclaim-workspace.sh trim || true

  sm120:
    name: sm120-generic
    runs-on: [self-hosted, Linux, X64, nvidia, fast, sm_120, rtx_5060ti_8gb]
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DOCKER_GPUS: device=0
      FUZZYBITS_CTR: fuzzybits-ci-${{ github.run_id }}-sm120-${{ github.run_attempt }}

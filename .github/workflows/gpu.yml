        with:
          path: .ccache
          key: ccache-linux-gpu-sm86-${{ env.TOOLCHAIN_SHA }}-clang${{ env.CLANG_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-gpu-sm86-${{ env.TOOLCHAIN_SHA }}-clang${{ env.CLANG_VERSION }}-
            ccache-linux-gpu-sm86-${{ env.TOOLCHAIN_SHA }}-

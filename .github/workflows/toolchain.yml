# Toolchain images: LLVM 20 + AdaptiveCpp (full) + CUDA 12.8 + Boost 1.89.
# Public repo. GitHub-hosted runners only (no pull_request, no self-hosted).
# Packages stay private; org.opencontainers.image.source links them to this repo
# so other fuzzybits workflows can pull with GITHUB_TOKEN.
name: Toolchain images

on:
  push:
    branches: [develop]
    paths:
      - toolchain.env
      - docker/toolchain.Dockerfile
      - Dockerfile.cuda12.8
      - .github/workflows/toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and push toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/fuzzybit-org/fuzzybits-toolchain
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # ubuntu-24.04 starts with ~20–30 GB free. nvidia/cuda:12.8.1-devel is
      # ~8 GB uncompressed plus LLVM/AdaptiveCpp/Boost layers; the buildfs
      # needs headroom. Drop hosted-image components this job does not use.
      - name: Free disk
        run: |
          set -eux
          echo "== disk before =="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/node \
            /usr/lib/jvm \
            /usr/local/.ghcup \
            /opt/microsoft \
            /usr/share/miniconda || true
          sudo docker system prune -af || true
          echo "== disk after =="
          df -h /

      - name: Load pins from toolchain.env
        run: |
          set -eu
          set -a
          # shellcheck disable=SC1091
          . ./toolchain.env
          set +a
          {
            echo "ACPP_REF=${ACPP_REF}"
            echo "ACPP_REPO=${ACPP_REPO}"
            echo "ACPP_COMMIT=${ACPP_COMMIT}"
            echo "CLANG_VERSION=${CLANG_VERSION}"
            echo "CUDA_DEVEL_IMAGE=${CUDA_DEVEL_IMAGE}"
            echo "CUDA_RUNTIME_IMAGE=${CUDA_RUNTIME_IMAGE}"
            echo "ACPP_COMPILER_FEATURE_PROFILE=${ACPP_COMPILER_FEATURE_PROFILE}"
            echo "BOOST_VERSION=${BOOST_VERSION}"
            echo "BOOST_URL=${BOOST_URL}"
            echo "BOOST_SHA256=${BOOST_SHA256}"
            echo "TOOLCHAIN_SHA=$(sha256sum toolchain.env | cut -c1-12)"
          } >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # One image serves both cmake --preset generic and cmake --preset cuda-sm70
      # (AdaptiveCpp full = SSCP + clang CUDA SMCP). Published under both variant
      # tags; cache is buildcache-generic (cuda12.8 is an alias, not a second build).
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/toolchain.Dockerfile
          target: toolchain
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ env.ACPP_REF }}-generic
            ${{ env.IMAGE }}:${{ env.ACPP_REF }}-cuda12.8
            ${{ env.IMAGE }}:${{ env.ACPP_REF }}-generic-${{ env.TOOLCHAIN_SHA }}
            ${{ env.IMAGE }}:${{ env.ACPP_REF }}-cuda12.8-${{ env.TOOLCHAIN_SHA }}
          build-args: |
            ACPP_REF=${{ env.ACPP_REF }}
            ACPP_REPO=${{ env.ACPP_REPO }}
            ACPP_COMMIT=${{ env.ACPP_COMMIT }}
            CLANG_VERSION=${{ env.CLANG_VERSION }}
            CUDA_DEVEL_IMAGE=${{ env.CUDA_DEVEL_IMAGE }}
            CUDA_RUNTIME_IMAGE=${{ env.CUDA_RUNTIME_IMAGE }}
            ACPP_COMPILER_FEATURE_PROFILE=${{ env.ACPP_COMPILER_FEATURE_PROFILE }}
            BOOST_VERSION=${{ env.BOOST_VERSION }}
            BOOST_URL=${{ env.BOOST_URL }}
            BOOST_SHA256=${{ env.BOOST_SHA256 }}
            FUZZYBITS_REVISION=${{ github.sha }}
            TOOLCHAIN_SHA=${{ env.TOOLCHAIN_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/fuzzybit-org/fuzzybits
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.ACPP_REF }}
            org.opencontainers.image.title=fuzzybits-toolchain
            org.opencontainers.image.description=LLVM ${{ env.CLANG_VERSION }} + AdaptiveCpp ${{ env.ACPP_REF }} (full SSCP + CUDA SMCP) for cmake --preset generic|cuda-sm70
            dev.fuzzybits.acpp.commit=${{ env.ACPP_COMMIT }}
            dev.fuzzybits.toolchain.sha=${{ env.TOOLCHAIN_SHA }}
            dev.fuzzybits.acpp.profile=${{ env.ACPP_COMPILER_FEATURE_PROFILE }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-generic
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-generic,mode=max

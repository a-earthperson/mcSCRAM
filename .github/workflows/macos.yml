# GitHub-hosted macOS. Public repo: macos minutes are free. Never self-hosted.
# Apple Silicon (macos-26): AdaptiveCpp from ACPP_REF_METAL with Metal+OpenMP.
# Intel (macos-15-intel, release only): OpenMP + generic SSCP, no Metal.
# PR CI builds the arm64 cp312 wheel only; release.yml passes 3.12–3.15 + Intel.
name: macOS

on:
  pull_request:
  push:
    branches: [develop, "ci/**"]
  workflow_dispatch:
    inputs:
      version_override:
        description: Rewrite package versions before building (TestPyPI rehearsals).
        type: string
        default: ""
      wheel_only:
        description: Skip macos-metal and build only the wheel.
        type: boolean
        default: false
      python_versions:
        description: Space-separated CPython versions to build wheels for.
        type: string
        default: "3.12"
      include_intel:
        description: Also build macosx_x86_64 wheels on macos-15-intel.
        type: boolean
        default: false
  # release.yml builds the macOS wheels through this workflow.
  workflow_call:
    inputs:
      version_override:
        description: Rewrite package versions before building (TestPyPI rehearsals).
        type: string
        default: ""
      wheel_only:
        description: Skip macos-metal and build only the wheel.
        type: boolean
        default: false
      python_versions:
        description: Space-separated CPython versions to build wheels for.
        type: string
        default: "3.12"
      include_intel:
        description: Also build macosx_x86_64 wheels on macos-15-intel.
        type: boolean
        default: false

concurrency:
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-metal:
    name: macos-metal
    if: ${{ !inputs.wheel_only }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ACPP_PREFIX: ${{ github.workspace }}/.cache/acpp-prefix
      BOOST_PREFIX: ${{ github.workspace }}/.cache/boost-prefix
      METAL_CPP_DIR: ${{ github.workspace }}/.cache/metal-cpp
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPILERTYPE: clang
      CCACHE_NOHASHDIR: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Require arm64
        run: |
          set -euo pipefail
          echo "uname -m=$(uname -m) ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-}"
          test "$(uname -m)" = "arm64"
          sw_vers
          df -h /

      - name: Load toolchain pins
        run: |
          set -eu
          set -a
          # shellcheck disable=SC1091
          . ./toolchain.env
          set +a
          {
            echo "ACPP_REPO=${ACPP_REPO}"
            echo "ACPP_REF_METAL=${ACPP_REF_METAL}"
            echo "METAL_CPP_VERSION=${METAL_CPP_VERSION}"
            echo "LLVM_VERSION=${LLVM_VERSION}"
            echo "BOOST_VERSION=${BOOST_VERSION}"
            echo "BOOST_URL=${BOOST_URL}"
            echo "BOOST_SHA256=${BOOST_SHA256}"
            echo "BOOST_INCLUDE_LIBRARIES=program_options;filesystem;system;random;range;exception;multi_index;accumulators;multiprecision;icl;math;dll;regex;test"
          } >> "${GITHUB_ENV}"
          test "${ACPP_REF_METAL}" != "TBD"
          test "${METAL_CPP_VERSION}" != "TBD"

      - name: Install Homebrew deps
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        # llvm@20 is preinstalled on macos-26; still ensure kegs exist.
        # Skip `brew update` (flaky, slow). AdaptiveCpp's own macos-metal.yml
        # uses llvm@20 + lld@20 + libomp.
        run: bash scripts/ci/macos-brew-deps.sh

      - name: Cache AdaptiveCpp install
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: acpp-cache
        with:
          path: ${{ env.ACPP_PREFIX }}
          key: acpp-${{ env.ImageOS }}-${{ runner.arch }}-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-${{ env.METAL_CPP_VERSION }}
          restore-keys: |
            acpp-${{ env.ImageOS }}-${{ runner.arch }}-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-

      - name: Cache Boost 1.89 install
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: boost-cache
        with:
          path: ${{ env.BOOST_PREFIX }}
          key: boost-${{ env.ImageOS }}-${{ runner.arch }}-${{ env.BOOST_VERSION }}-${{ env.BOOST_SHA256 }}

      - name: Cache ccache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-metal-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-metal-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-
            ccache-macos-metal-

      - name: Build Boost 1.89
        if: steps.boost-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/macos-boost-build.sh

      - name: Fetch metal-cpp
        run: bash scripts/ci/macos-metal-cpp-fetch.sh

      - name: Build AdaptiveCpp (Metal + OpenMP SSCP)
        id: acpp-build
        run: bash scripts/ci/macos-acpp-build.sh

      - name: Probe AdaptiveCpp devices
        id: probe
        run: |
          set -euo pipefail
          export PATH="${ACPP_PREFIX}/bin:${PATH}"
          export DYLD_LIBRARY_PATH="${ACPP_PREFIX}/lib:${OMP_PREFIX}/lib:${DYLD_LIBRARY_PATH:-}"
          export AdaptiveCpp_DIR="${ACPP_PREFIX}/lib/cmake/AdaptiveCpp"
          echo "## acpp-info" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          acpp-info -l | tee acpp-info.txt | tee -a "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          if [[ -f "${ACPP_PREFIX}/etc/AdaptiveCpp/acpp-core.json" ]]; then
            echo "## acpp-core.json" >> "${GITHUB_STEP_SUMMARY}"
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            cat "${ACPP_PREFIX}/etc/AdaptiveCpp/acpp-core.json" | tee -a "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi
          if grep -qiE 'metal|apple.*(gpu|paravirtual)|paravirtual' acpp-info.txt; then
            echo "metal_device=yes" >> "${GITHUB_OUTPUT}"
            echo "Metal device visible" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "metal_device=no" >> "${GITHUB_OUTPUT}"
            echo "No Metal device visible; CPU-only job." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Configure and build fuzzybits (metal preset)
        id: product
        run: |
          set -euo pipefail
          start=$(date +%s)
          export PATH="${ACPP_PREFIX}/bin:${LLVM_PREFIX}/bin:${PATH}"
          export DYLD_LIBRARY_PATH="${ACPP_PREFIX}/lib:${OMP_PREFIX}/lib:${DYLD_LIBRARY_PATH:-}"
          export AdaptiveCpp_DIR="${ACPP_PREFIX}/lib/cmake/AdaptiveCpp"
          export CMAKE_PREFIX_PATH="${ACPP_PREFIX}:${BOOST_PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
          export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
          cmake --preset metal \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DCMAKE_PREFIX_PATH="${ACPP_PREFIX};${BOOST_PREFIX}" \
            -DAdaptiveCpp_DIR="${ACPP_PREFIX}/lib/cmake/AdaptiveCpp" \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset metal
          echo "fuzzybits_build_seconds=$(( $(date +%s) - start ))" >> "${GITHUB_ENV}"
          df -h /
          ccache -s || true

      - name: scram-cli smoke
        run: |
          set -euo pipefail
          export PATH="${ACPP_PREFIX}/bin:${PATH}"
          export DYLD_LIBRARY_PATH="${ACPP_PREFIX}/lib:${OMP_PREFIX}/lib:${DYLD_LIBRARY_PATH:-}"
          bin="$(find build/metal -name scram-cli -type f | head -n 1)"
          test -n "${bin}"
          gtimeout 60 "${bin}" --help | head -n 40

      - name: ctest CPU (OpenMP, quarantine excluded)
        timeout-minutes: 20
        env:
          ACPP_VISIBILITY_MASK: omp
          ACPP_DEBUG_LEVEL: "0"
          ACPP_PERSISTENT_RUNTIME: "1"
        run: |
          set -euo pipefail
          export PATH="${ACPP_PREFIX}/bin:${PATH}"
          export DYLD_LIBRARY_PATH="${ACPP_PREFIX}/lib:${OMP_PREFIX}/lib:${DYLD_LIBRARY_PATH:-}"
          start=$(date +%s)
          ctest --preset metal-cpu --output-on-failure --no-tests=error
          echo "cpu_ctest_seconds=$(( $(date +%s) - start ))" >> "${GITHUB_ENV}"

      - name: ctest Metal (label mc)
        if: ${{ always() && steps.probe.outputs.metal_device == 'yes' && steps.product.outcome == 'success' }}
        timeout-minutes: 15
        continue-on-error: true
        env:
          ACPP_VISIBILITY_MASK: metal
          ACPP_DEBUG_LEVEL: "0"
          ACPP_PERSISTENT_RUNTIME: "1"
        run: |
          set -euo pipefail
          export PATH="${ACPP_PREFIX}/bin:${PATH}"
          export DYLD_LIBRARY_PATH="${ACPP_PREFIX}/lib:${OMP_PREFIX}/lib:${DYLD_LIBRARY_PATH:-}"
          start=$(date +%s)
          # Per-test TIMEOUT 60 is set in tests/mc/CMakeLists.txt.
          # Device-code failures (double, 64-bit atomics) belong to #30.
          ctest --preset metal -L mc --output-on-failure --no-tests=error \
            | tee metal-ctest.log
          echo "metal_ctest_seconds=$(( $(date +%s) - start ))" >> "${GITHUB_ENV}"

      - name: Record timings
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## macos-metal timings"
            echo "- AdaptiveCpp cache: ${{ steps.acpp-build.outputs.cache || 'n/a' }}"
            echo "- AdaptiveCpp build seconds: ${acpp_build_seconds:-n/a}"
            echo "- Boost build seconds: ${boost_build_seconds:-n/a (cache)}"
            echo "- fuzzybits build seconds: ${fuzzybits_build_seconds:-n/a}"
            echo "- CPU ctest seconds: ${cpu_ctest_seconds:-n/a}"
            echo "- Metal ctest seconds: ${metal_ctest_seconds:-n/a}"
            echo "- Metal device: ${{ steps.probe.outputs.metal_device }}"
            echo "- ACPP_REF_METAL: ${ACPP_REF_METAL}"
            echo "- METAL_CPP_VERSION: ${METAL_CPP_VERSION}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          ccache -s || true
          df -h /

  # Artifact-only macosx arm64 wheels. PR CI: cp312. Release: PYTHON_VERSIONS.
  # Not a required check; publishing is #36.
  macos-wheel:
    name: macos-wheel
    runs-on: macos-26
    timeout-minutes: 150
    env:
      ACPP_PREFIX: ${{ github.workspace }}/.cache/acpp-prefix
      BOOST_PREFIX: ${{ github.workspace }}/.cache/boost-prefix
      METAL_CPP_DIR: ${{ github.workspace }}/.cache/metal-cpp
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPILERTYPE: clang
      CCACHE_NOHASHDIR: 1
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      PYTHON_VERSIONS: ${{ inputs.python_versions || '3.12' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Apply version override
        if: ${{ inputs.version_override }}
        env:
          VERSION: ${{ inputs.version_override }}
        run: bash scripts/ci/release-version.sh apply "${VERSION}"

      - name: Require arm64
        run: |
          set -euo pipefail
          echo "uname -m=$(uname -m) ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-}"
          test "$(uname -m)" = "arm64"
          sw_vers
          df -h /

      - name: Load toolchain pins
        run: |
          set -eu
          set -a
          # shellcheck disable=SC1091
          . ./toolchain.env
          set +a
          {
            echo "ACPP_REPO=${ACPP_REPO}"
            echo "ACPP_REF_METAL=${ACPP_REF_METAL}"
            echo "METAL_CPP_VERSION=${METAL_CPP_VERSION}"
            echo "LLVM_VERSION=${LLVM_VERSION}"
            echo "BOOST_VERSION=${BOOST_VERSION}"
            echo "BOOST_URL=${BOOST_URL}"
            echo "BOOST_SHA256=${BOOST_SHA256}"
            echo "BOOST_INCLUDE_LIBRARIES=program_options;filesystem;system;random;range;exception;multi_index;accumulators;multiprecision;icl;math;dll;regex;test"
          } >> "${GITHUB_ENV}"
          test "${ACPP_REF_METAL}" != "TBD"
          test "${METAL_CPP_VERSION}" != "TBD"

      - name: Install Homebrew deps
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: bash scripts/ci/macos-brew-deps.sh

      - name: uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0

      - name: Cache AdaptiveCpp install
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: acpp-cache
        with:
          path: ${{ env.ACPP_PREFIX }}
          key: acpp-${{ env.ImageOS }}-${{ runner.arch }}-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-${{ env.METAL_CPP_VERSION }}
          restore-keys: |
            acpp-${{ env.ImageOS }}-${{ runner.arch }}-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-

      - name: Cache Boost 1.89 install
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: boost-cache
        with:
          path: ${{ env.BOOST_PREFIX }}
          key: boost-${{ env.ImageOS }}-${{ runner.arch }}-${{ env.BOOST_VERSION }}-${{ env.BOOST_SHA256 }}

      - name: Cache ccache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-wheel-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-wheel-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-
            ccache-macos-metal-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-
            ccache-macos-metal-

      - name: Build Boost 1.89
        if: steps.boost-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/macos-boost-build.sh

      - name: Fetch metal-cpp
        run: bash scripts/ci/macos-metal-cpp-fetch.sh

      - name: Build AdaptiveCpp (Metal + OpenMP SSCP)
        id: acpp-build
        run: bash scripts/ci/macos-acpp-build.sh

      - name: Build wheels
        id: wheel
        timeout-minutes: 90
        run: |
          set -euo pipefail
          start=$(date +%s)
          chmod +x scripts/ci/macos-wheel-build.sh scripts/ci/macos-delocate.sh \
            scripts/ci/macos-wheel-versions.sh scripts/ci/macos-smoke.py
          scripts/ci/macos-wheel-versions.sh build
          echo "wheel_build_seconds=$(( $(date +%s) - start ))" >> "${GITHUB_ENV}"
          df -h /
          ccache -s || true

      - name: Upload cp312 wheel
        if: always() && steps.wheel.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzybits-cp312-macosx_arm64
          path: dist/fuzzybits-*-cp312-*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload cp313 wheel
        if: always() && steps.wheel.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzybits-cp313-macosx_arm64
          path: dist/fuzzybits-*-cp313-*.whl
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload cp314 wheel
        if: always() && steps.wheel.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzybits-cp314-macosx_arm64
          path: dist/fuzzybits-*-cp314-*.whl
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload cp315 wheel
        if: always() && steps.wheel.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzybits-cp315-macosx_arm64
          path: dist/fuzzybits-*-cp315-*.whl
          if-no-files-found: ignore
          retention-days: 14

      - name: Smoke wheels
        if: always() && steps.wheel.outcome == 'success'
        timeout-minutes: 40
        run: scripts/ci/macos-wheel-versions.sh smoke

      - name: Record timings
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## macos-wheel timings (arm64)"
            echo "- PYTHON_VERSIONS: ${PYTHON_VERSIONS}"
            echo "- AdaptiveCpp cache: ${{ steps.acpp-build.outputs.cache || 'n/a' }}"
            echo "- AdaptiveCpp build seconds: ${acpp_build_seconds:-n/a}"
            echo "- Boost build seconds: ${boost_build_seconds:-n/a (cache)}"
            echo "- wheel+smoke seconds: ${wheel_build_seconds:-n/a}"
            echo "- wheel_cp312_seconds: ${wheel_cp312_seconds:-n/a}"
            echo "- wheel_cp313_seconds: ${wheel_cp313_seconds:-n/a}"
            echo "- wheel_cp314_seconds: ${wheel_cp314_seconds:-n/a}"
            echo "- wheel_cp315_seconds: ${wheel_cp315_seconds:-n/a}"
            echo "- smoke_cp312_seconds: ${smoke_cp312_seconds:-n/a}"
            echo "- smoke_cp313_seconds: ${smoke_cp313_seconds:-n/a}"
            echo "- smoke_cp314_seconds: ${smoke_cp314_seconds:-n/a}"
            echo "- smoke_cp315_seconds: ${smoke_cp315_seconds:-n/a}"
            echo "- ACPP_REF_METAL: ${ACPP_REF_METAL}"
            echo "- METAL_CPP_VERSION: ${METAL_CPP_VERSION}"
            echo "- MACOSX_DEPLOYMENT_TARGET: ${MACOSX_DEPLOYMENT_TARGET}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          ls -lah dist || true
          ccache -s || true
          df -h /

  # Intel macOS wheels (OpenMP + generic SSCP, no Metal). Release-only:
  # PR CI stays arm64 cp312. macos-15-intel is GitHub's x86_64 image; the
  # 15.0 deployment target installs on Intel Macs running macOS 15+, including 26.
  macos-wheel-intel:
    name: macos-wheel-intel
    if: ${{ inputs.include_intel }}
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      ACPP_PREFIX: ${{ github.workspace }}/.cache/acpp-prefix
      BOOST_PREFIX: ${{ github.workspace }}/.cache/boost-prefix
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPILERTYPE: clang
      CCACHE_NOHASHDIR: 1
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      WITH_METAL_BACKEND: "OFF"
      PYTHON_VERSIONS: ${{ inputs.python_versions || '3.12' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Apply version override
        if: ${{ inputs.version_override }}
        env:
          VERSION: ${{ inputs.version_override }}
        run: bash scripts/ci/release-version.sh apply "${VERSION}"

      - name: Require x86_64
        run: |
          set -euo pipefail
          echo "uname -m=$(uname -m) ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-}"
          test "$(uname -m)" = "x86_64"
          sw_vers
          df -h /

      - name: Load toolchain pins
        run: |
          set -eu
          set -a
          # shellcheck disable=SC1091
          . ./toolchain.env
          set +a
          {
            echo "ACPP_REPO=${ACPP_REPO}"
            echo "ACPP_REF_METAL=${ACPP_REF_METAL}"
            echo "LLVM_VERSION=${LLVM_VERSION}"
            echo "BOOST_VERSION=${BOOST_VERSION}"
            echo "BOOST_URL=${BOOST_URL}"
            echo "BOOST_SHA256=${BOOST_SHA256}"
            echo "BOOST_INCLUDE_LIBRARIES=program_options;filesystem;system;random;range;exception;multi_index;accumulators;multiprecision;icl;math;dll;regex;test"
            echo "ACPP_REF_TO_BUILD=${ACPP_REF_METAL}"
          } >> "${GITHUB_ENV}"
          test "${ACPP_REF_METAL}" != "TBD"

      - name: Install Homebrew deps
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: bash scripts/ci/macos-brew-deps.sh

      - name: uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0

      - name: Cache AdaptiveCpp install
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: acpp-cache
        with:
          path: ${{ env.ACPP_PREFIX }}
          key: acpp-${{ env.ImageOS }}-${{ runner.arch }}-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-nometal
          restore-keys: |
            acpp-${{ env.ImageOS }}-${{ runner.arch }}-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-nometal

      - name: Cache Boost 1.89 install
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: boost-cache
        with:
          path: ${{ env.BOOST_PREFIX }}
          key: boost-${{ env.ImageOS }}-${{ runner.arch }}-${{ env.BOOST_VERSION }}-${{ env.BOOST_SHA256 }}

      - name: Cache ccache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-intel-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-intel-${{ env.ACPP_REF_METAL }}-llvm${{ env.LLVM_VERSION }}-
            ccache-macos-intel-

      - name: Build Boost 1.89
        if: steps.boost-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/macos-boost-build.sh

      - name: Build AdaptiveCpp (OpenMP SSCP, no Metal)
        id: acpp-build
        run: bash scripts/ci/macos-acpp-build.sh

      - name: Probe AdaptiveCpp devices
        run: |
          set -euo pipefail
          export PATH="${ACPP_PREFIX}/bin:${PATH}"
          export DYLD_LIBRARY_PATH="${ACPP_PREFIX}/lib:${OMP_PREFIX}/lib:${DYLD_LIBRARY_PATH:-}"
          echo "## acpp-info (intel, no Metal)" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          acpp-info -l | tee acpp-info.txt | tee -a "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          if grep -qiE 'metal' acpp-info.txt; then
            echo "::error::Metal backend visible on Intel AdaptiveCpp build"
            exit 1
          fi
          if ! grep -qiE 'omp|openmp|cpu' acpp-info.txt; then
            echo "::warning::acpp-info did not mention omp/cpu; continuing to smoke"
          fi

      - name: Build wheels
        id: wheel
        timeout-minutes: 120
        run: |
          set -euo pipefail
          start=$(date +%s)
          chmod +x scripts/ci/macos-wheel-build.sh scripts/ci/macos-delocate.sh \
            scripts/ci/macos-wheel-versions.sh scripts/ci/macos-smoke.py
          scripts/ci/macos-wheel-versions.sh build
          echo "wheel_build_seconds=$(( $(date +%s) - start ))" >> "${GITHUB_ENV}"
          df -h /
          ccache -s || true

      - name: Upload cp312 wheel
        if: always() && steps.wheel.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzybits-cp312-macosx_x86_64
          path: dist/fuzzybits-*-cp312-*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload cp313 wheel
        if: always() && steps.wheel.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzybits-cp313-macosx_x86_64
          path: dist/fuzzybits-*-cp313-*.whl
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload cp314 wheel
        if: always() && steps.wheel.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzybits-cp314-macosx_x86_64
          path: dist/fuzzybits-*-cp314-*.whl
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload cp315 wheel
        if: always() && steps.wheel.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzybits-cp315-macosx_x86_64
          path: dist/fuzzybits-*-cp315-*.whl
          if-no-files-found: ignore
          retention-days: 14

      - name: Smoke wheels
        if: always() && steps.wheel.outcome == 'success'
        timeout-minutes: 50
        run: scripts/ci/macos-wheel-versions.sh smoke

      - name: Record timings
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## macos-wheel-intel timings (x86_64)"
            echo "- PYTHON_VERSIONS: ${PYTHON_VERSIONS}"
            echo "- AdaptiveCpp cache: ${{ steps.acpp-build.outputs.cache || 'n/a' }}"
            echo "- AdaptiveCpp build seconds: ${acpp_build_seconds:-n/a}"
            echo "- Boost build seconds: ${boost_build_seconds:-n/a (cache)}"
            echo "- wheel+smoke seconds: ${wheel_build_seconds:-n/a}"
            echo "- wheel_cp312_seconds: ${wheel_cp312_seconds:-n/a}"
            echo "- wheel_cp313_seconds: ${wheel_cp313_seconds:-n/a}"
            echo "- wheel_cp314_seconds: ${wheel_cp314_seconds:-n/a}"
            echo "- wheel_cp315_seconds: ${wheel_cp315_seconds:-n/a}"
            echo "- smoke_cp312_seconds: ${smoke_cp312_seconds:-n/a}"
            echo "- smoke_cp313_seconds: ${smoke_cp313_seconds:-n/a}"
            echo "- smoke_cp314_seconds: ${smoke_cp314_seconds:-n/a}"
            echo "- smoke_cp315_seconds: ${smoke_cp315_seconds:-n/a}"
            echo "- ACPP_REF_METAL: ${ACPP_REF_METAL}"
            echo "- MACOSX_DEPLOYMENT_TARGET: ${MACOSX_DEPLOYMENT_TARGET}"
            echo "- Homebrew llvm: ${LLVM_PREFIX:-}"
            echo "- limitation: Metal is Apple Silicon only; this wheel is OpenMP CPU"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          ls -lah dist || true
          ccache -s || true
          df -h /

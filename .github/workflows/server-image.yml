# Server image on top of fuzzybits-runtime → GHCR. Public repo.
#
# Runs on the self-hosted `fuzzybits-ci` runner group; never on pull_request.
# Registry pushes never run on pull_request; this workflow is not triggered
# by pull_request / pull_request_target / workflow_run (#34).
#
# Image: ghcr.io/fuzzybit-org/fuzzybits-server  (public; same as fuzzybits-runtime).
#
# Runtime base tag:
#   - workflow_dispatch input `runtime_tag` wins (stem or full tag).
#   - else on ci/**: newest existing ci-*-<variant> or nightly-<variant>
#     (GHCR versions newest-first).
#   - else (develop / tags): sha-<this-sha12>-<variant> if published,
#     else nightly-<variant>. On develop, the runtime job first waits for
#     this commit's Runtime images run to finish publishing, so an engine
#     change ships in the same commit's server image.
# Override with the dispatch input rather than editing this file.
#
# Every push builds, not only server changes: develop deploys each commit to
# dev.fuzzybit.org, and release tags deploy to live.fuzzybit.org (deploy job).
name: Server image

on:
  push:
    branches: [develop, "ci/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: >
          Runtime tag override (stem or full). Examples: nightly,
          sha-54254780c360, nightly-generic. Empty = auto
          (newest ci-*/nightly on ci/**; sha-<sha12> or nightly
          on develop/tags).
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/fuzzybit-org/fuzzybits-server
  RUNTIME_REPO: ghcr.io/fuzzybit-org/fuzzybits-runtime
  GHCR_PULL_AUTH: "false"

jobs:
  # Both workflows start on the same develop push, and the runtime build
  # outlasts this one. Polling from a hosted runner keeps the self-hosted
  # slots free for the runtime build it waits on. If that run skips publishing
  # (no engine change) or fails, publish falls back to nightly-<variant>.
  runtime:
    name: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
    steps:
      - name: Wait for this commit's runtime images
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs="repos/${GITHUB_REPOSITORY}/actions/workflows/images.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=develop"
          run_id=""
          for _ in $(seq 1 20); do
            run_id="$(gh api "${runs}" --jq '.workflow_runs[0].id // empty')"
            [[ -n ${run_id} ]] && break
            sleep 15
          done
          if [[ -z ${run_id} ]]; then
            echo "No Runtime images run for ${GITHUB_SHA}; publish uses what is published."
            exit 0
          fi
          echo "Runtime images run ${run_id}"
          while :; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            # publish jobs are listed once gate has finished; smoke can still be running
            publish="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
              --jq '.jobs[] | select(.name | startswith("publish-")) | .status')"
            echo "run ${status}; publish jobs: $(printf '%s' "${publish}" | tr '\n' ' ')"
            if [[ ${status} == completed ]] || { [[ -n ${publish} ]] && ! grep -qv '^completed$' <<<"${publish}"; }; then
              break
            fi
            sleep 60
          done
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            --jq '.jobs[] | select(.name | startswith("publish-")) | "\(.name): \(.conclusion)"'

  publish:
    name: publish-${{ matrix.variant }}
    needs: runtime
    if: ${{ !cancelled() }}
    runs-on: { group: fuzzybits-ci, labels: [self-hosted, Linux, X64] }
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        variant: [generic, cuda12.8-sm70]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Isolate Docker credentials (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "${GITHUB_ENV}"

      - name: Reclaim workspace (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          # Containers still mounting this workspace are left over from an earlier job.
          docker ps -aq --filter "volume=${GITHUB_WORKSPACE}" | xargs -r docker rm -f
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" -v "${RUNNER_TOOL_CACHE}:/t" alpine:3.20 chown -R "$(id -u):$(id -g)" /w /t

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Versions
        run: |
          set -eu
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          server_version="$(sed -n 's/^version = "\(.*\)"/\1/p' tools/server/pyproject.toml | head -1)"
          {
            echo "FUZZYBITS_VERSION=${version}"
            echo "SERVER_VERSION=${server_version}"
            echo "SHA12=${GITHUB_SHA:0:12}"
          } >> "${GITHUB_ENV}"

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${IMAGE}"
          VARIANT="${VARIANT}"
          SHA12="${SHA12}"
          tags=()
          if [[ "${GITHUB_REF}" == refs/heads/ci/* ]]; then
            primary="ci-${SHA12}-${VARIANT}"
            tags+=("${IMAGE}:${primary}")
          elif [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version="${GITHUB_REF_NAME}"
            primary="${version}-${VARIANT}"
            tags+=("${IMAGE}:${primary}")
            if [[ "${VARIANT}" == generic ]]; then
              tags+=("${IMAGE}:${version}")
              tags+=("${IMAGE}:latest")
            fi
          else
            # develop, workflow_dispatch on develop (or other trusted refs)
            primary="sha-${SHA12}-${VARIANT}"
            tags+=("${IMAGE}:nightly-${VARIANT}")
            tags+=("${IMAGE}:${primary}")
          fi
          {
            echo "primary=${primary}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "primary tag: ${primary}"
          printf 'tags:\n'
          printf '  %s\n' "${tags[@]}"

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Resolve runtime image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_TAG_INPUT: ${{ github.event.inputs.runtime_tag || '' }}
        run: |
          set -euo pipefail
          VARIANT="${VARIANT}"
          stem_from() {
            local raw="$1"
            raw="${raw#ghcr.io/fuzzybit-org/fuzzybits-runtime:}"
            raw="$(printf '%s' "${raw}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            case "${raw}" in
              *-cuda12.8-sm70) raw="${raw%-cuda12.8-sm70}" ;;
              *-generic) raw="${raw%-generic}" ;;
            esac
            printf '%s' "${raw}"
          }
          tag=""
          if [[ -n "${RUNTIME_TAG_INPUT}" ]]; then
            stem="$(stem_from "${RUNTIME_TAG_INPUT}")"
            tag="${stem}-${VARIANT}"
            echo "runtime tag from workflow_dispatch: ${tag}"
          elif [[ "${GITHUB_REF}" == refs/heads/ci/* ]]; then
            echo "listing fuzzybits-runtime tags for newest ci-*-${VARIANT} or nightly-${VARIANT}"
            mapfile -t tags < <(
              gh api --paginate \
                -H "Accept: application/vnd.github+json" \
                "/orgs/fuzzybit-org/packages/container/fuzzybits-runtime/versions?per_page=100" \
                --jq '.[].metadata.container.tags[]?' \
                | sed '/^$/d'
            )
            for t in "${tags[@]}"; do
              if [[ "${t}" == "nightly-${VARIANT}" || "${t}" == ci-*-"${VARIANT}" ]]; then
                tag="${t}"
                echo "newest matching tag: ${tag}"
                break
              fi
            done
            if [[ -z "${tag}" ]]; then
              tag="nightly-${VARIANT}"
              echo "no listed match; falling back to ${tag}"
            fi
          else
            sha_tag="sha-${SHA12}-${VARIANT}"
            if docker buildx imagetools inspect "${RUNTIME_REPO}:${sha_tag}" >/dev/null 2>&1; then
              tag="${sha_tag}"
              echo "same-commit runtime tag: ${tag}"
            else
              tag="nightly-${VARIANT}"
              echo "no ${sha_tag}; using ${tag}"
            fi
          fi
          RUNTIME_IMAGE="${RUNTIME_REPO}:${tag}"
          echo "RUNTIME_IMAGE=${RUNTIME_IMAGE}" >> "${GITHUB_ENV}"
          echo "inspecting ${RUNTIME_IMAGE}"
          docker buildx imagetools inspect "${RUNTIME_IMAGE}" | tee /tmp/runtime-inspect.txt
          digest="$(awk '/^Digest:/{print $2; exit}' /tmp/runtime-inspect.txt)"
          if [[ -z "${digest}" ]]; then
            echo "error: could not read digest of ${RUNTIME_IMAGE}" >&2
            exit 1
          fi
          echo "RUNTIME_DIGEST=${digest}" >> "${GITHUB_ENV}"
          echo "runtime ${RUNTIME_IMAGE}  digest ${digest}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: tools/server
          file: tools/server/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            RUNTIME_DIGEST=${{ env.RUNTIME_DIGEST }}
            VARIANT=${{ matrix.variant }}
            FUZZYBITS_REVISION=${{ github.sha }}
            FUZZYBITS_VERSION=${{ env.FUZZYBITS_VERSION }}
            SERVER_VERSION=${{ env.SERVER_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/fuzzybit-org/fuzzybits
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.FUZZYBITS_VERSION }}
            org.opencontainers.image.title=fuzzybits-server
            org.opencontainers.image.description=Compile OpenPSA/MEF fault trees to .pcfb and sample the top event
            org.opencontainers.image.base.name=${{ env.RUNTIME_IMAGE }}
            org.opencontainers.image.base.digest=${{ env.RUNTIME_DIGEST }}
            dev.fuzzybits.variant=${{ matrix.variant }}
            dev.fuzzybits.server.version=${{ env.SERVER_VERSION }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }},mode=max

      - name: Inspect published image
        run: |
          set -euo pipefail
          tag="${IMAGE}:${{ steps.meta.outputs.primary }}"
          echo "## ${{ matrix.variant }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- primary: \`${tag}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- runtime: \`${RUNTIME_IMAGE}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- runtime digest: \`${RUNTIME_DIGEST}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- digest: \`${{ steps.build.outputs.digest }}\`" >> "${GITHUB_STEP_SUMMARY}"
          docker buildx imagetools inspect "${tag}" | tee /tmp/inspect.txt
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          head -n 40 /tmp/inspect.txt >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      - name: Pull image for size + E2E
        if: matrix.variant == 'generic'
        run: |
          set -euo pipefail
          tag="${IMAGE}:${{ steps.meta.outputs.primary }}"
          docker pull "${tag}"
          docker image inspect "${tag}" --format '{{.Id}} {{.Size}}' \
            | awk '{printf "id=%s uncompressed_bytes=%s uncompressed_GiB=%.2f\n", $1, $2, $2/1024/1024/1024}' \
            | tee /tmp/size.txt
          size_gib="$(docker image inspect "${tag}" --format '{{.Size}}' | awk '{printf "%.2f", $1/1024/1024/1024}')"
          echo "- uncompressed: ${size_gib} GiB" >> "${GITHUB_STEP_SUMMARY}"
          python3 -c 'import sys; gib=float(sys.argv[1]); raise SystemExit(f"error: image {gib:.2f} GiB exceeds 5 GiB budget" if gib>=5.0 else 0)' "${size_gib}"

      - name: E2E smoke (CPU, Aralia chinese/das9201)
        if: matrix.variant == 'generic'
        env:
          ACPP_VISIBILITY_MASK: omp
          SMOKE_N: "1e7"
          SMOKE_TPP: "1000000"
          SMOKE_TIMEOUT: "90"
          SMOKE_Z_MAX: "4"
          SMOKE_NAME: fuzzybits-server-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          chmod +x tools/server/scripts/e2e-smoke.sh
          timeout 240 tools/server/scripts/e2e-smoke.sh "${IMAGE}:${{ steps.meta.outputs.primary }}"

      - name: Drop smoke container
        if: always() && matrix.variant == 'generic'
        run: docker rm -f fuzzybits-server-e2e-${{ github.run_id }}-${{ github.run_attempt }} || true

  # Redeploys one instance of the swarm stack fzb-app-fuzzybits-server once
  # both variants are published and the generic image has passed the e2e
  # smoke: a release tag goes to staging (live.fuzzybit.org), a develop push to
  # develop (dev.fuzzybit.org). It checks out nothing: the swarm manager runs
  # only these commands, against the instance's stack file mirrored on gateway
  # (from fuzzybit-org/swarm-deployment apps/fuzzybits-server/<instance>),
  # mounted read-only at its gateway path because `docker stack deploy` reads
  # it in the client. Each instance's file only declares its own service, so
  # one deploy leaves the other running. The image is pinned by digest so the
  # service runs exactly what this ref published.
  deploy:
    name: deploy-${{ github.ref_type == 'tag' && 'live' || 'dev' }}
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/develop')
    needs: publish
    runs-on:
      group: swarm-managers
    container:
      image: node:26-bookworm-slim
      options: >-
        --init
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /deployments/on-gateway/docker-swarm/@fuzzybit-org/apps/fuzzybits-server:/deployments/on-gateway/docker-swarm/@fuzzybit-org/apps/fuzzybits-server:ro
    timeout-minutes: 30
    # steps in a job container default to sh
    defaults:
      run:
        shell: bash
    concurrency:
      group: deploy-fuzzybits-server-${{ github.ref_type == 'tag' && 'staging' || 'develop' }}
      cancel-in-progress: false
    permissions:
      packages: read
    env:
      STACK: fzb-app-fuzzybits-server
      INSTANCE: ${{ github.ref_type == 'tag' && 'staging' || 'develop' }}
    steps:
      - name: Instance
        run: |
          set -euo pipefail
          if [[ ${GITHUB_REF_TYPE} == tag ]]; then
            tag="${GITHUB_REF_NAME}-cuda12.8-sm70"
          else
            tag="sha-${GITHUB_SHA:0:12}-cuda12.8-sm70"
          fi
          {
            echo "SERVICE=${STACK}_${INSTANCE}"
            echo "STACK_DIR=/deployments/on-gateway/docker-swarm/@fuzzybit-org/apps/fuzzybits-server/${INSTANCE}"
            echo "DEPLOY_TAG=${tag}"
          } >> "${GITHUB_ENV}"
          echo "${INSTANCE}: ${IMAGE}:${tag}"

      - name: Install base packages and the Docker CLI
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          echo "1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570  /etc/apt/keyrings/docker.asc" | sha256sum -c -
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y --no-install-recommends \
            docker-ce-cli=5:29.9.2-1~debian.12~bookworm \
            docker-buildx-plugin=0.38.1-1~debian.12~bookworm

      - name: Isolate Docker credentials
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "${GITHUB_ENV}"

      # --with-registry-auth forwards this read-only token to the node that
      # pulls. It expires with the job; a later restart reuses the pulled image.
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the published digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:${DEPLOY_TAG}" | awk '/^Digest:/{print $2; exit}')"
          [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No published digest for ${IMAGE}:${DEPLOY_TAG}." >&2; exit 1; }
          echo "DIGEST=${digest}" >> "${GITHUB_ENV}"
          echo "${IMAGE}:${DEPLOY_TAG} -> ${digest}"

      - name: Deploy the published digest
        working-directory: ${{ env.STACK_DIR }}
        run: |
          set -euo pipefail
          FUZZYBITS_SERVER_IMAGE="${IMAGE}@${DIGEST}" \
            docker stack deploy --detach=false --with-registry-auth -c stack.yml "${STACK}"

      - name: Verify the service runs that digest
        run: |
          set -euo pipefail
          image="$(docker service inspect "${SERVICE}" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"
          state="$(docker service inspect "${SERVICE}" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}')"
          replicas="$(docker service ls --filter "name=${SERVICE}" --format '{{.Replicas}}')"
          echo "${SERVICE}: ${image} update=${state:-none} replicas=${replicas}"
          echo "- ${INSTANCE}: \`${image}\` (update=${state:-none}, replicas=${replicas})" >> "${GITHUB_STEP_SUMMARY}"
          [[ ${image} == *"@${DIGEST}" ]] || { echo "Spec does not pin ${DIGEST}." >&2; exit 1; }
          [[ -z ${state} || ${state} == completed ]] || { echo "Update ended ${state}." >&2; exit 1; }
          [[ ${replicas} == 1/1 ]] || { echo "Service is not running." >&2; exit 1; }

      - name: Return workspace ownership to the runner user
        if: always()
        run: chown -R "$(stat -c '%u:%g' "${GITHUB_WORKSPACE}/..")" "${GITHUB_WORKSPACE}" "${HOME}" "${RUNNER_TEMP}"

# fuzzybits server with its built-in web UI.
#
#   docker compose up -d                                              # CPU (OpenMP)
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d   # NVIDIA GPU
#   docker compose --profile dev up -d --build server-dev             # build tools/server from this checkout
#
# Then open http://localhost:8000 (server-dev: http://localhost:8001).
# The image tag is pinned in .env; override any value there or in the shell.

x-server: &server
  # The published images are linux/amd64 only; Apple Silicon runs them emulated.
  platform: linux/amd64
  environment:
    FUZZYBITS_SERVER_UI: 1
    ACPP_VISIBILITY_MASK: ""
    ACPP_ADAPTIVITY_LEVEL: 1
    ACPP_PERSISTENT_RUNTIME: 1
    FUZZYBITS_BENCH_DATA_URL: ${FUZZYBITS_BENCH_DATA_URL:-https://fuzzybit-org.github.io/fuzzybits/bench/v1/index.json}
    FUZZYBITS_BENCH_CACHE_DIR: ${FUZZYBITS_BENCH_CACHE_DIR:-}
  volumes:
    # Public OpenPSA/Aralia models from this checkout; the catalog scans /data recursively.
    - ./input:/data:ro
    - fuzzybits-cache:/home/coder/.cache/fuzzybits
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3)"]
    interval: 15s
    timeout: 5s
    start_period: 20s
    retries: 3
  restart: unless-stopped

services:
  server:
    <<: *server
    image: ${FUZZYBITS_SERVER_IMAGE:-ghcr.io/fuzzybit-org/fuzzybits-server}:${FUZZYBITS_SERVER_TAG:-nightly-generic}
    ports:
      - "8000:8000"

  server-dev:
    <<: *server
    profiles: ["dev"]
    image: fuzzybits-server:dev
    build:
      context: tools/server
    ports:
      - "${FUZZYBITS_SERVER_BIND:-127.0.0.1}:${FUZZYBITS_SERVER_DEV_PORT:-8001}:8000"
    volumes:
      - ./input:/data:ro
      - fuzzybits-cache-dev:/home/coder/.cache/fuzzybits

volumes:
  fuzzybits-cache:
  fuzzybits-cache-dev:
